services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager"]
      interval: 2s
      retries: 30
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ["4566:4566"]
  migrate:
    build: .
    command: ["sh", "-c", "bun run migration:run && bun scripts/setup-sqs.ts"]
    environment: &env
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      EVENT_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_started}
  app:
    build: .
    environment: *env
    ports: ["3000:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      localstack: {condition: service_started}
  worker:
    build: .
    environment: *env
    depends_on:
      migrate: {condition: service_completed_successfully}
      localstack: {condition: service_started}
